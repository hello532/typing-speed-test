name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是硬要求：build.py 从 git 历史派生 datePublished/dateModified 与
      # sitemap lastmod。默认的浅克隆（1 个提交）会让日期塌成"今天"，产物与已提交 HTML
      # 不一致 → build drift check 必红（2026-10-31 r104/r105 连续失败即此因）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # 1) 产物必须与 src/ 一致（没人手编生成的 HTML）
      - name: build drift check
        run: python3 build.py --check

      # 2) 全量闸门：结构等价(骨架金标) + JSON-LD + sitemap/llms + 行为 harness
      - name: verify gates
        run: python3 verify.py

      # 3) 外链台账数据自检
      - name: backlink ledger check
        run: python3 src/tools/linkops.py ledger check

      # 4) 复盘快照（信息性，不作门禁）：离线确定性输出，便于人工看每轮增量。
      #    不设 continue-on-error — retro.py 离线只读，跑不通就该红。
      - name: retrospective snapshot
        run: python3 src/tools/retro.py

      # 5) 站点体检：死链 / 重复 title / canonical 自指 / h1 唯一 / sitemap 与 llms 一致。
      #    不依赖任何搜索 API，纯本地可判定，所以放在 CI 里当硬门禁。
      - name: site health
        run: python3 src/tools/health.py
